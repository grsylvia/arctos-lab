# Link geometry from local STL and STEP measurements, in CAD assembly millimetres.
# origin: link frame position; axis: joint axis in the CAD pose (positive by the right-hand rule).
# meshes: private STL parts combined in the link frame; translation corrects a part's assembly offset.
base_link:
  origin: [-0.529, 0.0, 56.94]  # bottom plane
  meshes:
    - file: X lower core_1-X lower core-stl.stl
    - file: X upper Core_1-X upper core (1) (2)-stl.stl

shoulder_link:
  parent: base_link
  joint: joint_1
  origin: [-0.529, 0.0, 186.846]  # base shaft, near its top
  axis: [0, 0, 1]
  meshes:
    - file: X pulley  shaft_1-X pulley shaft-stl.stl
    - file: Y L Core (1)_1-YL core-stl.stl
    - file: Y R Core_1-YR core-stl.stl

upper_arm_link:
  parent: shoulder_link
  joint: joint_2
  origin: [20.356, 0.0, 344.568]  # shoulder bearing axis
  axis: [0, 1, 0]
  meshes:
    - file: Z L lower Core_1-ZL lower core-stl.stl
    - file: Z R lower core (1)_1-Z R lower core-stl.stl
    - file: Z L middle core_1-ZL middle core-stl.stl
    - file: Z R middle core (1)_1-ZR middle core-stl.stl
    - file: Z L upper Core_1-ZL upper core-stl.stl
    - file: Z R upper Core_1-ZR upper core-stl.stl

elbow_link:
  parent: upper_arm_link
  joint: joint_3
  origin: [19.046, 0.065, 605.575]  # elbow shaft axis
  axis: [0, 1, 0]
  meshes:
    - file: ZL core 1_1-ZL core 1-stl.stl
    - file: ZR core_1-ZR core (1)-stl.stl
    - file: A core inner_1-A core inner-stl.stl
    - file: A core outer_1-A core outer (1)-stl.stl

wrist_roll_link:
  parent: elbow_link
  joint: joint_4
  origin: [154.805, 0.065, 627.28]  # A-core roll axis, near its face
  axis: [1, 0, 0]
  meshes:
    - file: A core.stl
    - file: BL core (1)_1-BL core (1) (1)-stl.stl
    - file: BR core_1-BR core-stl.stl

wrist_pitch_link:
  parent: wrist_roll_link
  joint: joint_5
  origin: [283.229, 0.309, 625.506]  # carrier bearing axis
  axis: [0, 1, 0]
  meshes:
    - file: B-core.stl
      # Shift the bore from X=280.229 to X=283.229 mm to match its carrier.
      translation: [3.0, 0.0, 0.0]
    - file: B core cap (1)_1-B core cap (1)-stl.stl

tool_link:
  parent: wrist_pitch_link
  joint: joint_6
  origin: [319.064, 0.309, 625.506]  # C-core axis, near its inner face
  axis: [1, 0, 0]
  meshes:
    - file: C core (1)_1-C core (1)-stl.stl
